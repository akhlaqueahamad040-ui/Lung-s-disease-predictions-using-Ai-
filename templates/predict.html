<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Symptom Prediction - LungAI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #030A14; --surface: #071525; --panel: #0C1E33;
    --border: rgba(0,220,255,0.15); --glow: #00DCFF; --glow2: #3A7BD5;
    --text: #C8E4F8; --muted: #4A7A9B; --white: #F0F8FF;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); font-family: 'Syne', sans-serif; color: var(--text); min-height: 100vh; }
  nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem;
    background: rgba(3,10,20,0.9); border-bottom: 1px solid var(--border); }
  .nav-brand { font-family: 'Space Mono', monospace; font-weight: 700; color: var(--glow); }
  .nav-links { display: flex; gap: 1.5rem; }
  .nav-links a { color: var(--muted); text-decoration: none; font-weight: 600; }

  .page { max-width: 700px; margin: 0 auto; padding: 2rem; }
  .page-header { text-align: center; margin-bottom: 2rem; }
  .page-header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
  .page-header p { color: var(--muted); }

  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 2rem; }
  .form-group { margin-bottom: 1.5rem; }
  .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 700; }
  .symptom-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
  .symptom-item { display: flex; align-items: center; }
  .symptom-item input { margin-right: 0.5rem; }
  .symptom-item label { margin: 0; cursor: pointer; }

  .submit-btn {
    width: 100%; padding: 1rem; background: linear-gradient(135deg, var(--glow2), var(--glow));
    color: #030A14; border: none; border-radius: 8px; font-weight: 800; font-size: 1.1rem;
    cursor: pointer; font-family: 'Syne', sans-serif; margin-top: 1rem;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0,220,255,0.3); }

  .flash { padding: 0.75rem; background: rgba(255,75,110,0.12); border: 1px solid #FF4B6E;
    border-radius: 8px; margin-bottom: 1.5rem; color: #FF8FA3; font-size: 0.85rem; }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-brand">LUNGAI</a>
  <div class="nav-links">
    <a href="/predict">Symptoms</a>
    <a href="/xray">X-Ray</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/logout">Logout</a>
  </div>
</nav>

<div class="page">
  <div class="page-header">
    <h1>Symptom Analysis</h1>
    <p>Input your symptoms for AI-powered lung disease risk assessment</p>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="flash">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <div class="form-card">
    <form method="POST">
      <div class="form-group">
        <label>Age</label>
        <input type="number" name="age" min="0" max="120" required/>
      </div>

      <div class="form-group">
        <label>Gender (0=Female, 1=Male)</label>
        <input type="number" name="gender" min="0" max="1" required/>
      </div>

      <div class="form-group">
        <label>Symptoms (Select: 0=No, 1=Yes)</label>
        <div class="symptom-grid">
          <div class="symptom-item">
            <input type="number" name="smoking" min="0" max="1" value="0"/>
            <label>Smoking</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="yellow_fingers" min="0" max="1" value="0"/>
            <label>Yellow Fingers</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="anxiety" min="0" max="1" value="0"/>
            <label>Anxiety</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="peer_pressure" min="0" max="1" value="0"/>
            <label>Peer Pressure</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="chronic_disease" min="0" max="1" value="0"/>
            <label>Chronic Disease</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="fatigue" min="0" max="1" value="0"/>
            <label>Fatigue</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="allergy" min="0" max="1" value="0"/>
            <label>Allergy</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="wheezing" min="0" max="1" value="0"/>
            <label>Wheezing</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="alcohol" min="0" max="1" value="0"/>
            <label>Alcohol</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="coughing" min="0" max="1" value="0"/>
            <label>Coughing</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="shortness_breath" min="0" max="1" value="0"/>
            <label>Shortness of Breath</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="swallowing_diff" min="0" max="1" value="0"/>
            <label>Swallowing Difficulty</label>
          </div>
          <div class="symptom-item">
            <input type="number" name="chest_pain" min="0" max="1" value="0"/>
            <label>Chest Pain</label>
          </div>
        </div>
      </div>

      <button type="submit" class="submit-btn">Get Prediction</button>
    </form>
  </div>
</div>

</body>
</html>
